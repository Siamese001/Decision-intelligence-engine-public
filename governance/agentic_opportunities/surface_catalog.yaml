catalog_id: "urn:nee:surface-catalog:wave1"
version: "1.0.0"
surfaces:
  - surface_id: "surface-audio-transcript"
    entrypoint: "nee.py record-meeting"
    modality: "audio/transcript"
    prompt_or_schema: "RAW_TRANSCRIPT_SYNTHESIS_PROMPT_V5_7.md"
    evaluator: "dual_pipeline.live_meeting_recorder_core.grounding_verifier"
    gate: "Gate 1.7 / Audio PCM & Attribution Lock"
    consumer: "dual_pipeline.answer_ledger.AnswerLedger"
    receipt: "reports/live_session_receipt.json"
    ci_owner: "nee-transcript-synthesis"
    status: "ACTIVE"

  - surface_id: "surface-document-ingest"
    entrypoint: "nee.py ingest-document"
    modality: "notes/documents/attachments"
    prompt_or_schema: "contracts/document_pipeline/schemas/document_manifest.json"
    evaluator: "dual_pipeline.document_pipeline_core.preflight"
    gate: "Preflight Physical Unit Proof Gate"
    consumer: "dual_pipeline.canonical_pipeline.lifecycle"
    receipt: "reports/document_conversion_receipt.json"
    ci_owner: "nee-ingestion"
    status: "ACTIVE"

  - surface_id: "surface-canonical-ingest"
    entrypoint: "nee.py ingest-meeting"
    modality: "ingestion"
    prompt_or_schema: "contracts/dual_pipeline/schemas/canonical_entity.json"
    evaluator: "tools.validate_output_hierarchy"
    gate: "Output Hierarchy & C01-C19 Conformance Gates"
    consumer: "CANONICAL_GRAPH.db"
    receipt: "reports/canonical_ingestion_receipt.json"
    ci_owner: "nee-ingestion"
    status: "ACTIVE"

  - surface_id: "surface-query-copilot"
    entrypoint: "nee.py query"
    modality: "query/copilot"
    prompt_or_schema: "contracts/answer_eval/answer_eval_receipt.schema.json"
    evaluator: "dual_pipeline.evals.answer_eval_core.judge"
    gate: "Groundedness & Citation Verification Gate"
    consumer: "dual_pipeline.answer_ledger.AnswerLedger"
    receipt: "reports/answer_eval_receipt.json"
    ci_owner: "nee-query"
    status: "ACTIVE"

  - surface_id: "surface-decisions"
    entrypoint: "DecisionService.evaluate_decision"
    modality: "decisions"
    prompt_or_schema: "contracts/dual_pipeline/schemas/decision_frame.json"
    evaluator: "dual_pipeline.decision_service_core.service.DecisionValidator"
    gate: "Typed Decision Margin & Discrimination Gate"
    consumer: "hitl_decision_ledger.sqlite"
    receipt: "reports/decision_frame_receipt.json"
    ci_owner: "nee-decision-intelligence"
    status: "ACTIVE"

  - surface_id: "surface-maintenance"
    entrypoint: "tools.govern_learning_proposals"
    modality: "maintenance"
    prompt_or_schema: "contracts/dual_pipeline/schemas/learning_proposal.json"
    evaluator: "dual_pipeline.maintenance_swarm.HarmPlanner"
    gate: "Observed Query Harm & Dry-Run Gate"
    consumer: "maintenance_swarm.audit_ledger"
    receipt: "reports/maintenance_dryrun_receipt.json"
    ci_owner: "nee-graph-maintenance"
    status: "ACTIVE"

  - surface_id: "surface-release"
    entrypoint: "tools.release_governance.py"
    modality: "release"
    prompt_or_schema: "contracts/dual_pipeline/schemas/retrieval-release-evaluation.schema.json"
    evaluator: "dual_pipeline.retrieval_release_core.evaluator"
    gate: "11 BGE-M3 Qualification Gates"
    consumer: "active_pair.json"
    receipt: "reports/release_qualification_receipt.json"
    ci_owner: "nee-release"
    status: "ACTIVE"

  - surface_id: "surface-cli-mcp"
    entrypoint: "nee.py CLI / mcp_server"
    modality: "CLI/MCP"
    prompt_or_schema: "contracts/dual_pipeline/schemas/mcp_tool_envelope.json"
    evaluator: "tools.validate_mcp_design"
    gate: "JSON-RPC Schema & Fail-Closed Transport Gate"
    consumer: "Host Tool Runner / Standard Streams"
    receipt: "reports/mcp_validation_receipt.json"
    ci_owner: "mcp-engineering"
    status: "ACTIVE"

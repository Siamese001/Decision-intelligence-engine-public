version: "1.0.0"
governance: "NEE-KG-ALIGNMENT-SURFACES"
description: "Authoritative Surface Catalog mapping entrypoints, modalities, prompts/schemas, evaluators, gates, consumers, receipts, and CI owners across all pipeline domains."

surfaces:
  - surface_id: "SURF-AUDIO-TRANSCRIPT"
    entrypoint: "nee record-meeting / dual_pipeline/live_meeting_recorder_core/audio_capture.py"
    modality: "audio/transcript"
    prompt_or_schema: "contracts/transcript_schema.json / config/prompts/synthesis/stages/01_raw_transcript.md"
    evaluator: "dual_pipeline/transcript_qa_core/evaluator.py::AcousticQualityGate"
    gate: "Gate 1 (Attribution & Diarization) / Gate F (Audio Completeness) / Gate 1.7 (ALR)"
    consumer: "dual_pipeline/transcript_stages_core/recap_executor.py"
    receipt: "reports/00_*_acoustic_provenance_receipt.json"
    ci_owner: "ci-audio-pipeline"
    status: "MAPPED"
    description: "Live and batched audio capture, acoustic provenance, diarization, and forensic transcript normalization."

  - surface_id: "SURF-NOTES-DOCUMENTS"
    entrypoint: "nee ingest-document / dual_pipeline/intake_core/document_ingestion.py"
    modality: "notes/documents/attachments"
    prompt_or_schema: "contracts/dual_pipeline/document_intake_contract.json"
    evaluator: "dual_pipeline/intake_core/document_validator.py::DocumentIngestionValidator"
    gate: "Gate 2 (Attachment and Plain English) / Gate 2.8 (Document Boundary)"
    consumer: "dual_pipeline/canonical_pipeline/ingestion_coordinator.py"
    receipt: "reports/document_intake_receipt.json"
    ci_owner: "ci-document-intake"
    status: "MAPPED"
    description: "Document, text note, and attachment ingestion, parsing, chunking, and boundary validation."

  - surface_id: "SURF-MEETING-INGESTION"
    entrypoint: "nee ingest-meeting / pipeline_a_intake/intake_service.py"
    modality: "ingestion"
    prompt_or_schema: "contracts/dual_pipeline/evidence_envelope_intake.json / config/prompts/synthesis/stages/02_executive_recap.md"
    evaluator: "dual_pipeline/llm_judge_core/batch_judge.py / dual_pipeline/transcript_qa_core/evaluator.py"
    gate: "Gate 2 (Executive Recap QA) / Gate 3 (Canonical Signal Projection) / Authoritative Intake Gate"
    consumer: "dual_pipeline/canonical_pipeline/publish_helper.py / Universal Write Gateway"
    receipt: "reports/intake_package_*.json / reports/*_acoustic_provenance_receipt.json"
    ci_owner: "ci-ingestion"
    status: "MAPPED"
    description: "Structured 3-stage meeting intake synthesis (transcript -> recap -> canonical signal projection)."

  - surface_id: "SURF-QUERY-COPILOT"
    entrypoint: "nee query / nee copilot / dual_pipeline/live_meeting_recorder_core/streaming_copilot.py"
    modality: "query/copilot"
    prompt_or_schema: "contracts/query_contract.json / dual_pipeline/prompts/copilot_guidance.md"
    evaluator: "dual_pipeline/retrieval/evaluators/bge_m3_evaluator.py / ColBERTGroundingEvaluator"
    gate: "Gate 4 (Grounding & Retrieval Clearance) / 11-Gate BGE-M3 Benchmark"
    consumer: "operator_cli / streaming_copilot_channel"
    receipt: "reports/copilot_answer_receipt_*.json / reports/query_receipt_*.json"
    ci_owner: "ci-query-copilot"
    status: "MAPPED"
    description: "Hybrid knowledge graph retrieval, real-time grounded meeting copilot, and knowledge lookup."

  - surface_id: "SURF-DECISIONS"
    entrypoint: "nee decision / dual_pipeline/decision/agents/decision_orchestrator.py"
    modality: "decisions"
    prompt_or_schema: "contracts/dual_pipeline/decision_frame_schema.json / config/operator_decision_vocabulary.py"
    evaluator: "dual_pipeline/decision/evaluators/dialectical_judge.py"
    gate: "Pre-Wave Decision Intercept / Gate 30 (Mutex HITL Resolution)"
    consumer: "CANONICAL_GRAPH.db / hitl_decision_ledger.json"
    receipt: "reports/decision_frame_receipt_*.json / hitl_decision_ledger.json"
    ci_owner: "ci-decision-intelligence"
    status: "MAPPED"
    description: "Strategic decision framing, dialectical evaluation, trade-off analysis, and HITL decision resolution."

  - surface_id: "SURF-MAINTENANCE"
    entrypoint: "nee graph-cleanup / dual_pipeline/canonical_pipeline/graph_maintenance.py"
    modality: "maintenance"
    prompt_or_schema: "contracts/graph_maintenance_contract.json"
    evaluator: "dual_pipeline/maintenance/topology_auditor.py::GraphModelIntegrityAuditor"
    gate: "Gate GC (Candidate Pruning & Consolidation) / Wave Maintenance Gate"
    consumer: "CANONICAL_GRAPH.db / SHADOW_GRAPH.db"
    receipt: "reports/graph_maintenance_receipt_*.json"
    ci_owner: "ci-maintenance"
    status: "MAPPED"
    description: "Knowledge graph garbage collection, candidate node consolidation, and source retirement."

  - surface_id: "SURF-RELEASE"
    entrypoint: "tools/pr_governance.py merge / dual_pipeline/release_policy.py"
    modality: "release"
    prompt_or_schema: "contracts/dual_pipeline/release_decision_contract.json"
    evaluator: "dual_pipeline/release_policy.py::verify_authoritative_release_gate / eval_retrieval_11gates"
    gate: "28-Gate / 29-Gate Main Readiness / E3 BGE-M3 Gate / W0-E0 Audits"
    consumer: "main_branch_activation / active_graph_pair"
    receipt: "reports/pr_review_*_receipt.json / reports/retrieval_qualification_receipt.json"
    ci_owner: "ci-release-governance"
    status: "MAPPED"
    description: "Canonical release qualification, multi-gate readiness verification, and main branch promotion."

  - surface_id: "SURF-CLI-MCP"
    entrypoint: "nee <subcommand> / mcp_servers/"
    modality: "CLI/MCP"
    prompt_or_schema: "contracts/mcp_tool_definitions.json / JSON-RPC 2.0"
    evaluator: "tools/validate_mcp_design.py::MCPToolContractValidator"
    gate: "Pre-Execution Parameter Gate / Zero-Egress Scrub Gate"
    consumer: "Antigravity Agent Runtime / MCP Clients"
    receipt: "reports/mcp_tool_execution_receipt.json"
    ci_owner: "ci-mcp-engineering"
    status: "MAPPED"
    description: "Model Context Protocol (MCP) server endpoints, tool routing, and governed CLI commands."
